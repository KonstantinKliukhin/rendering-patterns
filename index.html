<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Live Docker Stats</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>Live Docker Stats</h2>
  <canvas id="cpuChart" width="1200" height="400"></canvas>

  <script>
    async function drawChart() {
      const response = await fetch('/data');
      const data = await response.json();

      // беремо тільки перший контейнер
      const containerName = Object.keys(data)[0];
      const containerData = data[containerName];

      const ctx = document.getElementById('cpuChart').getContext('2d');

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: containerData.time,
          datasets: [{
            label: `CPU Usage (%) — ${containerName}`,
            data: containerData.cpu,
            borderColor: 'rgba(75, 192, 192, 1)',
            backgroundColor: 'rgba(75, 192, 192, 0.2)',
            tension: 0.3,
            fill: true,
            pointRadius: 0
          }]
        },
        options: {
          responsive: true,
          animation: false,
          scales: {
            x: {
              ticks: {
                maxTicksLimit: 20
              }
            },
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: '% CPU'
              }
            }
          }
        }
      });
    }

    drawChart();
  </script>
</body>
</html>
